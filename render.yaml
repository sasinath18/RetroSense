services:
  - type: web
    name: retrosense-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: CORS_ORIGINS
        value: "https://sasinath18.github.io"
